[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse-managed-rooms"
version = "0.1.0"
description = "Synapse module: rooms are created in the leading system, not beside it."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["matrix", "synapse", "spam-checker", "module", "access-control"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Chat",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.23", "mypy>=1.8", "ruff>=0.4"]

[project.urls]
Source = "https://github.com/brasilspace/synapse-managed-rooms"
Issues = "https://github.com/brasilspace/synapse-managed-rooms/issues"
Design = "https://github.com/brasilspace/prilog_docs/blob/main/umsetzung/synapse-modul/synapse-managed-homeserver-konzept.md"

[tool.setuptools]
packages = ["synapse_managed_rooms"]

[tool.setuptools.package-data]
synapse_managed_rooms = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
strict = true
warn_unused_ignores = false
[[tool.mypy.overrides]]
module = "synapse.*"
ignore_missing_imports = true
